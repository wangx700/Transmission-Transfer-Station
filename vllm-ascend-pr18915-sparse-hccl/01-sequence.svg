<line x1="1744" y1="2087" x2="584" y2="2087" stroke="#174b72" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="1164.0" y="2079" text-anchor="middle" font-size="12">39. tokens</text>
<line x1="584" y1="2134" x2="120" y2="2134" stroke="#174b72" marker-end="url(#arrow)"/>
<text x="352.0" y="2126" text-anchor="middle" font-size="12">40. HTTP response</text>
<text x="30" y="2234" font-size="14">Failure: unwind entered views in reverse order; no finish/resume after a failed send. Restoring views does not roll back weights.</text>
<text x="30" y="2258" font-size="14">All workers receive before PP filtering. Wire indices stay int32; loader indices are int64. Staging remains O(N).</text>
<text x="30" y="2282" font-size="14">Base synchronization exists; the cross-ambient-device target is not directly covered. See Markdown for parallel blocks and failure detail.</text>
